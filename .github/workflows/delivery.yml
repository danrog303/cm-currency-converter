name: Continuous delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plasmo-extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: plasmo-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build --target=chrome-mv3
      - run: pnpm package --target=chrome-mv3
      - name: Validate Chrome ZIP
        run: python ../.github/scripts/chrome-store.py validate build/chrome-mv3-prod.zip
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: plasmo-extension/build/chrome-mv3-prod.zip
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-lambda
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: aws-actions/setup-sam@v3
      - run: sam validate --lint --region eu-central-1
      - run: sam build --build-dir "$RUNNER_TEMP/sam-build"
      - if: github.event_name == 'push'
        run: |
          cp samconfig.toml "$RUNNER_TEMP/sam-build/samconfig.toml"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/sam-build.tar.gz" sam-build
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: sam-build
          path: ${{ runner.temp }}/sam-build.tar.gz
          if-no-files-found: error

  deploy-aws:
    if: github.event_name == 'push'
    needs: [extension, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::This run is stale. Use the workflow run for the current main commit."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: sam-build
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/sam-build.tar.gz"
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Deploy SAM stack
        working-directory: ${{ runner.temp }}/sam-build
        run: |
          sam deploy --template-file template.yaml \
            --no-confirm-changeset --no-fail-on-empty-changeset
      - name: Smoke test the currency API
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 \
            'https://34wx13a345.execute-api.eu-central-1.amazonaws.com/Prod/currency/PLN' \
            | jq -e '.rates.EUR | type == "number" and . > 0' > /dev/null

  chrome-web-store:
    needs: deploy-aws
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension
          path: ${{ runner.temp }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Submit newer version for review
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: python .github/scripts/chrome-store.py submit "$RUNNER_TEMP/chrome-mv3-prod.zip"
